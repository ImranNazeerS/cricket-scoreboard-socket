# fly.toml app configuration file generated for iplscore on 2025-07-13T15:26:04+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'iplscore'
primary_region = 'bom'

[build]

[env]
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    method = 'get'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
